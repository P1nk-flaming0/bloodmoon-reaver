# Bloodmoon Reaver release workflow
# Packages the mod with AL|EN's Infinity Auto Packager (CreateIEModPackage)
# and publishes a GitHub Release when a v* tag is pushed.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing git tag to release (e.g. v1.0.0)'
        required: true
        type: string
      draft:
        description: 'Create the GitHub Release as a draft'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Resolve tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          # Strip leading "v" so we match Keep a Changelog headings like ## [1.0.0]
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: ${TAG} (version ${VERSION})"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/tags/${{ steps.meta.outputs.tag }}

      - name: Extract release notes from CHANGELOG.md
        id: changelog
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail

          FALLBACK="See [CHANGELOG.md](./CHANGELOG.md) for details about release ${TAG}."

          if [ ! -f CHANGELOG.md ]; then
            echo "CHANGELOG.md not found; using fallback body."
            printf '%s\n' "$FALLBACK" > release-notes.md
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Extract only the section for this version from Keep a Changelog format:
          #   ## [1.0.0] - YYYY-MM-DD
          # Stop at the next ## [version] heading or the reference-link footer.
          awk -v version="$VERSION" '
            BEGIN { printing = 0; found = 0 }
            /^## \[/ {
              if (printing) exit
              header = $0
              sub(/^## \[/, "", header)
              sub(/\].*$/, "", header)
              if (header == version) {
                printing = 1
                found = 1
                print
                next
              }
            }
            printing {
              if ($0 ~ /^## \[/) exit
              if ($0 ~ /^\[[Uu]nreleased\]:/) exit
              if ($0 ~ /^\[[0-9]+\.[0-9].*\]:/) exit
              print
            }
            END { exit found ? 0 : 1 }
          ' CHANGELOG.md > release-notes.md 2>/dev/null || true

          if [ ! -s release-notes.md ]; then
            echo "No changelog entry for version ${VERSION}; using fallback body."
            printf '%s\n' "$FALLBACK" > release-notes.md
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "Extracted changelog entry for version ${VERSION}."
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

          echo "----- release-notes.md -----"
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Bloodmoon Reaver ${{ steps.meta.outputs.tag }}
          body_path: release-notes.md
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  package:
    name: Package (${{ matrix.type }})
    needs: create-release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Infinity Auto Packager outputs:
        # - iemod: Project Infinity package (all platforms)
        # - zip:   cross-platform zip with Windows + macOS WeiDU binaries
        #          (Linux installs via .iemod / system WeiDU)
        type: [iemod, zip]
    steps:
      - name: Initial setup
        run: |
          git lfs uninstall || true
          git config --global core.autocrlf false
          git config --global core.ignorecase true

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.create-release.outputs.tag }}

      # Prepare a clean tree for Infinity Auto Packager:
      # IAP packages only the mod folder next to the .tp2 (PF#werefighter/)
      # plus generated WeiDU launchers at the archive root.
      - name: Prepare clean package contents
        run: |
          set -euo pipefail

          MOD_DIR='PF#werefighter'

          # Ship README inside the mod folder (repo-root README stays for GitHub).
          cp -f README.md "${MOD_DIR}/README.md"

          # PI metadata must sit beside the .tp2 for naming + inclusion.
          # Prefer exact ModID casing expected by CreateIEModPackage.
          if [ -f 'pf#werefighter.ini' ]; then
            cp -f 'pf#werefighter.ini' "${MOD_DIR}/PF#werefighter.ini"
          elif [ -f 'PF#werefighter.ini' ]; then
            cp -f 'PF#werefighter.ini' "${MOD_DIR}/PF#werefighter.ini"
          else
            echo 'ERROR: pf#werefighter.ini not found at repository root' >&2
            exit 1
          fi

          # Explicitly drop root development / tooling files so they cannot
          # leak into archives if packaging scope ever widens.
          rm -rf \
            lib \
            .github \
            .gitmodules \
            node_modules \
            tmp-work \
            bak \
            dump-2-json.ps1 \
            package.json \
            package-lock.json \
            'SETUP-PF#werefighter.exe' \
            || true

          # Keep only the distributable mod folder (+ metadata/readme we just copied).
          # WeiDU launchers are injected by CreateIEModPackage into the archive.
          echo 'Package tree after cleanup:'
          find . -maxdepth 2 \( -name .git -prune \) -o -print | sort

      # AL|EN's Infinity Auto Packager action
      # Packages: PF#werefighter/ (+ ini & README) and generated SETUP-PF#werefighter.* launchers
      - name: Create ${{ matrix.type }} package
        id: CreateIEModPackage
        uses: ALIENQuake/CreateIEModPackage@master
        with:
          type: ${{ matrix.type }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload ${{ matrix.type }} package to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ steps.CreateIEModPackage.outputs.PackageBaseName }}.${{ matrix.type }}
          asset_name: ${{ steps.CreateIEModPackage.outputs.PackageBaseName }}.${{ matrix.type }}
          tag: ${{ needs.create-release.outputs.tag }}
          overwrite: true
